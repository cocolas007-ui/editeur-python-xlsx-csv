<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Éditeur Python — XLSX & CSV</title>
    <style>
      /* ── Reset & base (style CCJS) ─────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background: #fafaf8;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px;
      }

      a { text-decoration: none; color: inherit; }
      [hidden] { display: none !important; }

      /* ── Header (identique CCJS) ───────────────────────────────── */
      header {
        background: #1e3a5f;
        color: #fff;
        flex-shrink: 0;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 20px;
      }

      .site-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: .3px;
      }

      /* ── Zone principale : éditeur en iframe ───────────────────── */
      .editor-wrap {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px;
        padding: 16px 20px;
      }

      .panel-title {
        margin: 0;
        font-size: 16px;
        color: #1e3a5f;
      }

      .editor-frame {
        background: #fff;
        border: 1px solid #e0e0d8;
        border-radius: 8px;
        overflow: hidden;
        min-height: 0;
      }

      #pythonFrame {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }

      .frame-hint {
        margin: 0;
        font-size: 12px;
        color: #6b7280;
      }

      /* ── Bouton plein écran ────────────────────────────────────── */
      .header-back {
        font-size: 13px;
        font-weight: 600;
        color: #1e3a5f;
        background: #fff;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        transition: background .15s, border-color .15s;
      }
      .header-back:hover { border-color: #1e3a5f; background: #eef2ff; }

      header .header-back {
        color: #fff;
        background: transparent;
        border-color: rgba(255, 255, 255, .4);
      }
      header .header-back:hover { background: rgba(255, 255, 255, .12); border-color: #fff; }

      /* ── Footer (identique CCJS) ───────────────────────────────── */
      footer {
        flex-shrink: 0;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
        padding: 12px 20px;
        border-top: 1px solid #e0e0d8;
        background: #fff;
      }
      footer p { margin: 0; line-height: 1.5; }

      /* ── Responsive ────────────────────────────────────────────── */
      @media (max-width: 900px) {
        .editor-wrap { padding: 10px; }
        .editor-frame { min-height: 70vh; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <span class="site-title">🐍 Éditeur Python — XLSX & CSV</span>
        <div class="header-actions">
          <button id="fullscreenButton" class="header-back" title="Plein écran">⛶ Plein écran</button>
        </div>
      </div>
    </header>

    <!-- Zone Éditeur : application Streamlit chargée dans une iframe.
         ⚠️ Remplacez l'URL ci-dessous par l'URL de votre app déployée
         (par ex. https://editeur-python-xlsx-csv.streamlit.app) -->
    <div class="editor-wrap">
      <h3 class="panel-title">Éditeur de traitement de données :</h3>
      <div class="editor-frame">
        <iframe
          id="pythonFrame"
          title="Éditeur Python"
          src="https://editeur-python-xlsx-csv.streamlit.app"
          allow="clipboard-write"
        ></iframe>
      </div>
      <p class="frame-hint">
        Chargez un fichier .xlsx ou .csv, écrivez votre code Python dans
        l'éditeur, exécutez le traitement, puis téléchargez le résultat.
      </p>
    </div>

    <footer>
      <p>© 2026 — Éditeur Python XLSX / CSV<br />Chargement · Traitement · Téléchargement</p>
    </footer>

    <script>
      // Plein écran : masque header et footer pour ne garder que l'éditeur.
      const btn = document.getElementById('fullscreenButton');
      let fullscreen = false;
      btn.addEventListener('click', () => {
        fullscreen = !fullscreen;
        document.querySelectorAll('header, footer, .panel-title, .frame-hint')
          .forEach(el => (el.hidden = fullscreen));
        btn.textContent = fullscreen ? '✕ Quitter le plein écran' : '⛶ Plein écran';
      });
    </script>
  </body>
</html>
